<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iwé Vocabulary Buddy</title>
<meta name="description" content="Learn new words offline with flashcards, quizzes, and a daily word, plus a friendly owl to keep you company.">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F9F9FF">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iwé">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3c-4 0-7 2.7-7 6.5C5 13 7 15 8.5 16l-.7 3.5c-.1.6.5 1 1 .7L11 18c.3 0 .7.1 1 .1 4 0 7-2.7 7-6.5S16 3 12 3Z" fill="#7C5CFC"/><circle cx="9.5" cy="10" r="1.4" fill="#fff"/><circle cx="14.5" cy="10" r="1.4" fill="#fff"/></svg>
      <span class="brand-text">Iwé</span>
    </div>
    <div class="topbar-right">
      <button class="accent-toggle" id="accentToggle" title="Switch pronunciation accent">UK</button>
      <div class="streak" id="streakBadge">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-2 4-2 7a3 3 0 1 0 6 0c1.5 1 2 3 2 4.5A6 6 0 1 1 8 10c0-2.5 2-3.5 4-8Z"/></svg>
        <span id="streakCount">0</span>
      </div>
    </div>
  </div>

  <!-- ============ HOME ============ -->
  <section class="view active" id="view-home">
    <div class="owl-wrap">
      <div class="owl" id="homeOwl">
        <div class="wing l"></div><div class="wing r"></div>
        <div class="book"></div>
        <div class="body"></div>
        <div class="belly"></div>
        <div class="ear l"></div><div class="ear r"></div>
        <div class="eye l"><div class="pupil"></div></div>
        <div class="eye r"><div class="pupil"></div></div>
        <div class="beak"></div>
      </div>
    </div>

    <div class="section-label">Word of the day</div>
    <div class="specimen" id="wordOfDayCard"></div>

    <div class="stats-row">
      <div class="stat"><div class="num" id="statSaved">0</div><div class="lbl">Saved words</div></div>
      <div class="stat"><div class="num" id="statAccuracy">—</div><div class="lbl">Quiz accuracy</div></div>
      <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">Best streak</div></div>
    </div>
  </section>

  <!-- ============ CARDS ============ -->
  <section class="view" id="view-cards">
    <div class="section-label">Flashcards</div>
    <div class="card-stage" id="cardsStage"></div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section class="view" id="view-quiz">
    <div class="section-label">Quiz</div>
    <div id="quizStage"></div>
  </section>

  <!-- ============ DICTIONARY ============ -->
  <section class="view" id="view-dictionary">
    <div class="section-label">Look up a word</div>
    <div class="search-row">
      <input type="text" id="dictInput" placeholder="Type any word…" autocomplete="off">
      <button id="dictSearchBtn">Search</button>
    </div>
    <div class="status-line" id="dictStatus"></div>
    <div id="dictResult" style="margin-top:16px;"></div>
  </section>

  <!-- ============ MY WORDS ============ -->
  <section class="view" id="view-mywords">
    <div class="section-label">My words</div>
    <div class="search-row" style="margin-bottom:12px;">
      <input type="text" id="myWordsSearch" placeholder="Search your words…" autocomplete="off">
    </div>
    <div class="chip-row" id="categoryChips"></div>
    <div class="chip-row" id="difficultyChips"></div>
    <div class="word-list" id="myWordsList"></div>
  </section>

  <a class="credit" href="contact.html">Made by DevRenike</a>
</div>

<div class="tabbar">
  <div class="tabbar-inner">
    <button class="tab-btn active" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      Home
    </button>
    <button class="tab-btn" data-view="cards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="13" height="16" rx="3" transform="rotate(4 12 12)"/><rect x="5" y="5" width="13" height="16" rx="3" fill="var(--bg)"/></svg>
      Cards
    </button>
    <button class="tab-btn" data-view="quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .8-1 1.7" stroke-linecap="round"/><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/></svg>
      Quiz
    </button>
    <button class="tab-btn" data-view="dictionary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
      Dictionary
    </button>
    <button class="tab-btn" data-view="mywords">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h9a2 2 0 0 1 2 2v14l-6.5-3.5L4 20V6a2 2 0 0 1 2-2Z"/></svg>
      My Words
    </button>
  </div>
</div>

<div class="detail-overlay hidden" id="detailOverlay">
  <div class="detail-sheet">
    <div class="close-row"><button id="detailClose">✕</button></div>
    <div id="detailContent"></div>
  </div>
</div>

<script src="words-data.js"></script>
<script src="app.js"></script>
</body>
</html>
